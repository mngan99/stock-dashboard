<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ming Stock Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
  margin:0;
  padding:20px;
  background:#111827;
  color:white;
  font-family:Arial;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

.dashboard{

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(300px,1fr));

  gap:20px;
}

.card{

  background:#1f2937;

  border-radius:12px;

  padding:20px;

  border:3px solid #374151;

  box-shadow:
  0 4px 10px rgba(0,0,0,0.4);

}

table{

  width:100%;

  border-collapse:collapse;

}

th,td{

  padding:10px;

  text-align:left;

}

th{

  background:#374151;

}

.buy{
  border-color:#10b981;
}

.sell{
  border-color:#ef4444;
}

.hold{
  border-color:#f59e0b;
}

</style>

</head>

<body>

<h1>Ming Stock Dashboard</h1>

<div id="dashboard"
class="dashboard">
</div>

<script>

const API_URL =
'https://script.google.com/macros/library/d/1RNRYWXqyv9y_gkh138mU6X0UKb1FAZQKurhzWtB-lLC0JYm4XiDjGxfU/5';

async function loadStocks(){

  const response =
    await fetch(API_URL);

  const data =
    await response.json();

  renderDashboard(data);

}

function renderDashboard(data){

  const dashboard =
    document.getElementById('dashboard');

  dashboard.innerHTML = '';

  const latestStocks = {};

  data.forEach(item => {

    latestStocks[item.Symbol] = item;

  });

  Object.values(latestStocks)
    .forEach(stock => {

      let cardClass = 'hold';

      if(stock.Action.includes('BUY'))
        cardClass = 'buy';

      if(stock.Action.includes('SELL'))
        cardClass = 'sell';

      const card = document
        .createElement('div');

      card.className =
        `card ${cardClass}`;

      card.innerHTML = `

        <h2>${stock.Symbol}</h2>

        <p>
        Price:
        $${stock.Price}
        </p>

        <p>
        Daily:
        ${stock['Daily %']}%
        </p>

        <p>
        Weekly:
        ${stock['Weekly %']}%
        </p>

        <p>
        Monthly:
        ${stock['Monthly %']}%
        </p>

        <h3>
        ${stock.Action}
        </h3>

      `;

      dashboard.appendChild(card);

    });

}

loadStocks();

</script>

</body>

</html>
