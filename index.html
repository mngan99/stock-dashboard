<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stock Recommendation Dashboard</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    background:#121212;
    color:white;
    padding:20px;
}

.card{
    background:#1e1e1e;
    border:none;
    border-radius:15px;
}

.table{
    color:white;
}

.buy{
    color:#00ff99;
    font-weight:bold;
}

.sell{
    color:#ff6666;
    font-weight:bold;
}

.hold{
    color:#ffd966;
    font-weight:bold;
}

canvas{
    background:white;
    border-radius:10px;
    padding:10px;
}

</style>

</head>

<body>

<div class="container-fluid">

<h1 class="mb-4">
Stock Recommendation Dashboard
</h1>

<div class="row mb-4">

<div class="col-md-3">
<div class="card p-3">
<h5>Total Stocks</h5>
<h2 id="totalStocks">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h5>Buy Signals</h5>
<h2 id="buySignals">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h5>Sell Signals</h5>
<h2 id="sellSignals">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="card p-3">
<h5>Hold Signals</h5>
<h2 id="holdSignals">0</h2>
</div>
</div>

</div>

<div class="card p-3 mb-4">

<table class="table table-striped">

<thead>
<tr>
<th>Symbol</th>
<th>Current</th>
<th>Week Ago</th>
<th>Weekly $</th>
<th>Weekly %</th>
<th>Action</th>
</tr>
</thead>

<tbody id="stockTable"></tbody>

</table>

</div>

<div class="card p-3">

<h4 class="mb-3">Weekly Change Chart</h4>

<canvas id="stockChart"></canvas>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwIHOHwq0Kh-Pr-uDecd3Dd8k7dC3EbUT8OoOZmnZlbtSaSvYBcP2Zvm6V8swsdQYw6/exec";

async function loadDashboard(){

    const response = await fetch(API_URL);

    const data = await response.json();

    buildTable(data);

    buildChart(data);

}

function buildTable(data){

    const tbody =
      document.getElementById("stockTable");

    tbody.innerHTML = "";

    let buyCount = 0;
    let sellCount = 0;
    let holdCount = 0;

    data.forEach(stock => {

        let actionClass = "hold";

        if(stock.action.includes("BUY")) {
            actionClass = "buy";
            buyCount++;
        }
        else if(stock.action.includes("SELL")) {
            actionClass = "sell";
            sellCount++;
        }
        else {
            holdCount++;
        }

        tbody.innerHTML += `
        <tr>
            <td>${stock.symbol}</td>
            <td>$${stock.currentPrice}</td>
            <td>$${stock.weekAgoPrice}</td>
            <td>$${stock.priceDiff}</td>
            <td>${stock.pctChange}%</td>
            <td class="${actionClass}">
                ${stock.action}
            </td>
        </tr>
        `;

    });

    document.getElementById("totalStocks")
      .innerText = data.length;

    document.getElementById("buySignals")
      .innerText = buyCount;

    document.getElementById("sellSignals")
      .innerText = sellCount;

    document.getElementById("holdSignals")
      .innerText = holdCount;

}

function buildChart(data){

    const labels =
      data.map(s => s.symbol);

    const changes =
      data.map(s => parseFloat(s.pctChange));

    new Chart(
      document.getElementById("stockChart"),
      {
        type:'bar',
        data:{
          labels:labels,
          datasets:[{
            label:'Weekly % Change',
            data:changes
          }]
        },
        options:{
          responsive:true
        }
      }
    );

}

loadDashboard();

</script>

</body>
</html>
